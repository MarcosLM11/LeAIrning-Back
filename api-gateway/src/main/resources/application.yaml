server:
  port: 8090

spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:http://localhost:8091"
  cloud:
    config:
      enabled: true
      uri: http://localhost:8091
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "http://localhost:4200"
                allowedMethods: [ GET, POST, PUT, DELETE, OPTIONS ]
                allowedHeaders: "*"
                allowCredentials: true
          routes:
            - id: monolith
              uri: http://localhost:8080
              predicates:
                - Path=/api/**,/auth/**,/oauth2/**

management:
  endpoint:
    gateway:
      access: read-only
  endpoints:
    web:
      exposure:
        include: health, gateway, info
