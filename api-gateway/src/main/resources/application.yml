server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          #Configuración global de CORS
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "http://localhost:3000"
                  - "http://localhost:5173"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                exposed-headers:
                  - X-Request-Id
                  - X-User-Id
                  - Content-Disposition
                allow-credentials: true
                max-age: 3600

          #Definición de rutas
          routes:
            - id: users-service
              uri: lb://users-service
              predicates:
                - Path=/api/*/users/**
              filters:
                - AddRequestHeader=X-Forwarded-By, api-gateway

            - id: documents-service
              uri: lb://documents-service
              predicates:
                - Path=/api/*/documents/**
              filters:
                - AddRequestHeader=X-Forwarded-By, api-gateway

            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/*/auth/**
              filters:
                - AddRequestHeader=X-Forwarded-By, api-gateway

jwt:
  secret: ${JWT_SECRET:dev-secret-key-minimum-32-characters-long}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:admin}:${EUREKA_PASSWORD:admin123}@${EUREKA_HOST:localhost}:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    gateway:
      enabled: true
