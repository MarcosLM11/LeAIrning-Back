server:
  port: 8083

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/authdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:dev-secret-key-minimum-32-characters-long}
  access-token-ttl: PT1H
  refresh-token-ttl: P7D

users-service:
  base-url: http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health, info
