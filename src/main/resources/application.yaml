spring:
  application:
    name: LeAIrning-Back

  datasource:
    url: jdbc:postgresql://localhost:5432/leairningdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: update

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB