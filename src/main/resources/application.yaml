leairning:
  cache:
    caffeine:
      documents-maximum-size: 1000
      documents-expire-after-access: 60s
      users-maximum-size: 1000
      users-expire-after-access: 60s
      rate-limit-maximum-size: 100000
      rate-limit-expire-after-access: 1h

  storage:
    minio:
      endpoint: http://localhost:9000
      access-key: minioadmin
      secret-key: minioadmin
      documents-bucket: leairning-documents
      processing-bucket: leairning-processing
      auto-create-buckets: true

  pipeline:
    chunk-size: 500
    keep-separator: false
    min-chunk-length: 10

  jwt:
    access-token-ttl: 30m
    refresh-token-ttl: 7d

  secret:
    jwt:
      value: ${JWT_SECRET:ThisIsADevelopmentSecretKeyThatShouldBeAtLeast64BytesLongForHS512Algorithm!}
      algorithm: HS512

  auth:
    frontend-url: ${FRONTEND_URL:http://localhost:4200}

  ai:
    chat:
      max-messages: 1000

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: LeAIrning-Back

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope: openid, profile, email
            redirect-uri: "http://localhost:8080/login/oauth2/code/google"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:noreply@leairning.com}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  datasource:
    url: jdbc:postgresql://localhost:5432/leairningdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: none

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  cache:
    type: caffeine

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2
          temperature: 0.7
      embedding:
        options:
          model: nomic-embed-text

    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: documents
        initialize-schema: true

  cloud:
    compatibility-verifier:
      enabled: false
    function:
      definition: fileSupplier|metadataEnricher|documentReader|splitter|vectorStoreConsumer
      web:
        export:
          enabled: false
    integration:
      poller:
        fixed-delay: 5000
        max-messages-per-poll: 1

bucket4j:
  enabled: true
  cache-to-use: jcache
  methods:
    - name: default
      cache-name: rate-limit-buckets
      rate-limit:
        cache-key: '@rateLimitKeyProvider.getIp()'
        bandwidths:
          - capacity: 60
            time: 1
            unit: minutes

    - name: strict
      cache-name: rate-limit-buckets
      rate-limit:
        cache-key: '@rateLimitKeyProvider.getIp()'
        bandwidths:
          - capacity: 10
            time: 1
            unit: minutes

    - name: lenient
      cache-name: rate-limit-buckets
      rate-limit:
        cache-key: '@rateLimitKeyProvider.getIp()'
        bandwidths:
          - capacity: 100
            time: 1
            unit: minutes

logging:
  level:
    org.apache.fontbox: ERROR
    org.apache.pdfbox: WARN

logbook:
  format:
    style: http