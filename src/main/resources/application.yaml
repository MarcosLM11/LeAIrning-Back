leairning:
  cache:
    caffeine:
      documents-maximum-size: 1000
      documents-expire-after-access: 60s
      users-maximum-size: 1000
      users-expire-after-access: 60s
      rate-limit-maximum-size: 100000
      rate-limit-expire-after-access: 1h
  storage:
    minio:
      endpoint: http://localhost:9000
      access-key: minioadmin
      secret-key: minioadmin
      documents-bucket: leairning-documents
      processing-bucket: leairning-processing
      auto-create-buckets: true

spring:
  application:
    name: LeAIrning-Back

  datasource:
    url: jdbc:postgresql://localhost:5432/leairningdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  cache:
    type: caffeine

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

bucket4j:
  enabled: true
  cache-to-use: jcache
  methods:
    - name: default
      cache-name: rate-limit-buckets
      rate-limit:
        cache-key: '@rateLimitKeyProvider.getIp()'
        bandwidths:
          - capacity: 60
            time: 1
            unit: minutes

    - name: strict
      cache-name: rate-limit-buckets
      rate-limit:
        cache-key: '@rateLimitKeyProvider.getIp()'
        bandwidths:
          - capacity: 10
            time: 1
            unit: minutes

    - name: lenient
      cache-name: rate-limit-buckets
      rate-limit:
        cache-key: '@rateLimitKeyProvider.getIp()'
        bandwidths:
          - capacity: 100
            time: 1
            unit: minutes