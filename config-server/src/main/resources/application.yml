server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO_PATH:file:/Users/marcos/Projects/LeAIrning/LeAIrning-Back/config-repo}
  security:
    user:
      name: ${CONFIG_USER:configadmin}
      password: ${CONFIG_PASSWORD:configsecret}

encrypt:
  key: ${ENCRYPT_KEY:dev-encrypt-key-minimum-16-chars}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:admin}:${EUREKA_PASSWORD:admin123}@${EUREKA_HOST:localhost}:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

management:
  endpoints:
    web:
      exposure:
        include: health, info, env, refresh