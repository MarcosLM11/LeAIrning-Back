server:
  port: 8082

spring:
  application:
    version: 1.0.0
    
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/documentsdb
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
      
  ai:
    ollama:
      base-url: ${OLLAMA_URL:http://ollama:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2}
          temperature: 0.7
      embedding:
        options:
          model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
          
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:qdrant}
        port: ${QDRANT_PORT:6334}
        collection-name: documents
        initialize-schema: true
        
  cloud:
    compatibility-verifier:
      enabled: false
    function:
      definition: fileSupplier|documentReader|splitter|vectorStoreConsumer
      
  integration:
    poller:
      fixed-delay: 5000
      max-messages-per-poll: 1

file:
  supplier:
    directory: ${document.storage.processing-input:./storage/processing-input}
    filename-regex: .*\\.(pdf|docx|doc|txt|csv|md)
  consumer:
    mode: ref

document:
  storage:
    location: ./uploads
    processing-input: ./storage/processing-input
    
  processing:
    chunk-size: 500
    keep-separator: false
    min-chunk-length: 10

storage:
  type: minio
  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    documents-bucket: leairning-documents
    processing-bucket: leairning-processing
    auto-create-buckets: false

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER}:${EUREKA_PASSWORD}@${EUREKA_HOST}:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

management:
  endpoints:
    web:
      exposure:
        include: health, info
      base-path: /actuator