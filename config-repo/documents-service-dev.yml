server:
  port: 8082

spring:
  application:
    version: 1.0.0
    
  datasource:
    url: jdbc:postgresql://localhost:5432/documentsdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 20000
      idle-timeout: 300000
    
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
      
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2
          temperature: 0.7
      embedding:
        options:
          model: nomic-embed-text
          
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: documents
        initialize-schema: true
        
  cloud:
    compatibility-verifier:
      enabled: false
    function:
      definition: fileSupplier|metadataEnricher|documentReader|splitter|vectorStoreConsumer
  integration:
    poller:
      fixed-delay: 5000
      max-messages-per-poll: 1

file:
  supplier:
    directory: ${document.storage.processing-input:./storage/processing-input}
    filename-regex: .*\\.(pdf|docx|doc|txt|csv|md)
  consumer:
    mode: ref

document:
  
  storage:
    location: ./uploads
    processing-input: ./storage/processing-input
    
  processing:
    chunk-size: 500
    keep-separator: false
    min-chunk-length: 10

storage:
  type: minio
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin123
    documents-bucket: leairning-documents
    processing-bucket: leairning-processing
    auto-create-buckets: true

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:admin}:${EUREKA_PASSWORD:admin123}@${EUREKA_HOST:localhost}:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, refresh
      base-path: /actuator