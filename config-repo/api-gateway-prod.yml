server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}

spring:
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "https://leairning.com"
                  - "https://app.leairning.com"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                exposed-headers:
                  - X-Request-Id
                  - X-User-Id
                  - Content-Disposition
                allow-credentials: true
                max-age: 3600
          routes:
            - id: users-service
              uri: lb://users-service
              predicates:
                - Path=/api/*/users/**
              filters:
                - AddRequestHeader=X-Forwarded-By, api-gateway
              
            - id: documents-service
              uri: lb://documents-service
              predicates:
                - Path=/api/*/documents/**
              filters:
                - AddRequestHeader=X-Forwarded-By, api-gateway
              
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/*/auth/**
              filters:
                - AddRequestHeader=X-Forwarded-By, api-gateway

            - id: chat-service
              uri: lb://chat-service
              predicates:
                - Path=/api/*/chat/**
              filters:
                - AddRequestHeader=X-Forwarded-By, api-gateway

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER}:${EUREKA_PASSWORD}@${EUREKA_HOST}:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    gateway:
      enabled: false