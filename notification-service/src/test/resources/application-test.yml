spring:
  application:
    name: notification-service
  config:
    import: ""
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    consumer:
      group-id: notification-service-test
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.marcos.notificationservice.dto
        spring.json.value.default.type: com.marcos.notificationservice.dto.NotificationEvent
  mail:
    host: localhost
    port: 3025
    from: test@leairning.com
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false

kafka:
  topics:
    notifications: notifications-test

notification:
  async:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 10

eureka:
  client:
    enabled: false