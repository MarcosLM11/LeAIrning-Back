server:
  port: 8082

spring:
  application:
    version: 1.0.0
    name: documents-service

  datasource:
    url: jdbc:postgresql://localhost:5432/documentsdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2
          temperature: 0.7
      embedding:
        options:
          model: nomic-embed-text
    vectorstore:
      qdrant:
        collection-name: documents
        initialize-schema: true

  # Spring Cloud Function pipeline configuration
  cloud:
    function:
      definition: fileSupplier|documentReader|splitter|vectorStoreConsumer

  # Spring Integration poller for file monitoring
  integration:
    poller:
      fixed-delay: 5000
      max-messages-per-poll: 1

# File Supplier Configuration (for Spring Cloud Function pipeline)
file:
  supplier:
    directory: ${document.storage.processing-input:./storage/processing-input}
    filename-regex: .*\\.(pdf|docx|doc|txt|csv|md)
  consumer:
    mode: ref

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator

# Document storage configuration
document:
  storage:
    location: ./uploads
    processing-input: ./storage/processing-input
  processing:
    chunk-size: 500
    keep-separator: false
    min-chunk-length: 10